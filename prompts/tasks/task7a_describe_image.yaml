description: |
  Você receberá, ao final desta mensagem, uma DESCRIÇÃO VISUAL DA IMAGEM já obtida por uma ferramenta de visão computacional.

  Sua tarefa é organizar essa descrição em um texto completo, claro e bem estruturado, em português, cobrindo todas as categorias abaixo:
  1. **Título do gráfico** (exatamente como aparece na imagem)
  2. **Tipo de gráfico** (barras, linhas, dispersão, pizza, área, etc.)
  3. **Eixos:** rótulos, unidades e escala de cada eixo
  4. **Legendas:** cores e categorias representadas
  5. **Dados visuais:** valores aproximados, alturas das barras, pontos, tendências visíveis
  6. **Layout:** orientação, agrupamentos, destaques visuais
  7. **Mensagem principal:** o que o gráfico parece comunicar visualmente

  Se a descrição fornecida não contiver alguma categoria, preencha com "não identificado" em vez de inventar informações.

  Seja preciso e objetivo. Não faça julgamentos de qualidade nem análise estatística.

expected_output: |
  Uma descrição textual detalhada em português do gráfico, com todas as informações visuais organizadas por categoria (título, tipo, eixos, legendas, dados, layout, mensagem). A descrição deve ser suficientemente completa para que alguém que não vê a imagem possa reconstruir mentalmente o gráfico.
