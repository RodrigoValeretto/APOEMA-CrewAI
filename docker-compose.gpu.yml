# GPU override for the ollama service (NVIDIA).
#
# Use ONLY on machines with an NVIDIA GPU + nvidia-container-toolkit installed:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# On machines WITHOUT a GPU, run plain `docker compose up -d --build` — this file
# is not loaded, so nothing breaks. CPU-only machines never touch this override.
#
# Prereq on the GPU machine (once, as root):
#   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
# Verify with: docker info | grep -i runtime
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
