[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "apoema-crewai"
version = "0.1.0"
description = "APOEMA-CrewAI - AI-powered assessment and analysis system that integrates with APOEMA dashboard system to analyze its plots and provide insights and recommendations."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Rodrigo Valeretto", email = "rodrigoaugustovaleretto@gmail.com"}
]

dependencies = [
    "crewai[tools]==1.15.16",
    "crewai-files==1.15.16",
    "openai>=2.37.0",
    "google-genai>=2.4.0",
    "pydantic>=2.11.9,<2.13",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.1.0",
    # Pinned <2: dramatiq 2.x quebra a CLI (exige positional broker) e a API de
    # filas (queue -> queue_name); o repo inteiro opera na linha 1.x.
    "dramatiq[rabbitmq]>=1.15.0,<2.0.0",
    "pika>=1.3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest>=7.0.0",
]
converter = [
    # PDF/XLSX -> JSON document conversion (docling is imported lazily so the
    # analysis workers never pay the torch cost unless they run a conversion)
    "docling>=2.100.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/RodrigoValeretto/APOEMA-CrewAI"
Repository = "https://github.com/RodrigoValeretto/APOEMA-CrewAI"
Issues = "https://github.com/RodrigoValeretto/APOEMA-CrewAI/issues"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist"]
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.isort]
profile = "black"
line_length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
