>>>>>>> eb9f8f4 (Fixing rag indexer implementation)
    working_dir: /app
    networks:
      - apoema_network

  # RabbitMQ como broker do Dramatiq
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: apoema-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - apoema_network

  # Ollama server para modelos de LLM
  ollama:
    image: ollama/ollama:latest
    container_name: apoema-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NUM_GPU: 1
    networks:
      - apoema_network
    entrypoint: ["/bin/bash", "/ollama-entrypoint.sh"]

  # Worker Dramatiq (executará tarefas assíncronas)
  dramatiq_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apoema-dramatiq-worker
    command: dramatiq --verbose tasks
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-apoema}
      DB_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      DB_NAME: ${DB_NAME:-apoema_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      DRAMATIQ_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      OLLAMA_HOST: http://ollama:11434
      PYTHONUNBUFFERED: 1
      # Task timeout configuration
      TASK_TIMEOUT_MINUTES: ${TASK_TIMEOUT_MINUTES:-15}
      # Dramatiq worker configuration
      DRAMATIQ_WORKER_TIMEOUT: ${DRAMATIQ_WORKER_TIMEOUT:-900}
      DRAMATIQ_WORKER_MAX_RETRIES: ${DRAMATIQ_WORKER_MAX_RETRIES:-2}
      DRAMATIQ_PREFETCH_COUNT: ${DRAMATIQ_PREFETCH_COUNT:-1}
      # Disable forking to keep long-running tasks alive
      DRAMATIQ_FORK_WORKERS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    networks:
      - apoema_network
    # Healthcheck to monitor worker process
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dramatiq tasks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Increase stop timeout to allow graceful shutdown of long-running tasks
    stop_grace_period: 120s

  # FastAPI application (API server)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apoema-app
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-apoema}
      DB_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      DB_NAME: ${DB_NAME:-apoema_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      OLLAMA_HOST: http://ollama:11434
      PYTHONUNBUFFERED: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: "False"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - ./input:/app/input
      - ./output:/app/output
    working_dir: /app
    networks:
      - apoema_network
    # Runs the API server (default from Dockerfile)
    command: python run_api.py

volumes:
  postgres_data:
  rabbitmq_data:
  ollama_data:

networks:
  apoema_network:
    driver: bridge