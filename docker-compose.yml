services:
  # PostgreSQL com pgvector
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: apoema-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-apoema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      POSTGRES_DB: ${DB_NAME:-apoema_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apoema} -d ${DB_NAME:-apoema_db} -h localhost"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - apoema_network

  # Flyway para migrations
  flyway:
    image: flyway/flyway:latest-alpine
    container_name: apoema-flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/apoema_db
      FLYWAY_USER: apoema
      FLYWAY_PASSWORD: apoema_dev_password
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./migrations/sql:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apoema_network

  # RAG Indexer — indexes input/ and uploads/ files into pgvector (one-shot, runs on startup)
  rag-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apoema-rag-indexer
    command: python scripts/index_rag.py --create-vector-index
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-apoema}
      DB_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      DB_NAME: ${DB_NAME:-apoema_db}
      OLLAMA_BASE_URL: http://ollama:11434
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - ./input:/app/input
