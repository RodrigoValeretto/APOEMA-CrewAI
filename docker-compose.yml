services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: apoema-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-apoema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      POSTGRES_DB: ${DB_NAME:-apoema_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apoema} -d ${DB_NAME:-apoema_db} -h localhost"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - apoema_network

  # Flyway para migrations
  flyway:
    image: flyway/flyway:latest-alpine
    container_name: apoema-flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/apoema_db
      FLYWAY_USER: apoema
      FLYWAY_PASSWORD: apoema_dev_password
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./migrations/sql:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apoema_network

  # RabbitMQ como broker do Dramatiq
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: apoema-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - apoema_network

  # Ollama server para modelos de LLM
  ollama:
    image: ollama/ollama:latest
    container_name: apoema-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NUM_GPU: 1
      # CrewAI's openai-compatible client does NOT send options.num_ctx, so the
      # ollama server default (4096) truncated the assessment JSON prompts
      # (~13K tokens) -> runaway generation -> httpx.ReadTimeout (2026-09-09).
      # Raise the server-wide default so every request gets a real window.
      OLLAMA_CONTEXT_LENGTH: 16384
      # phi4-mini (16K ctx, ~4.9GB) + qwen2.5vl (~3.2GB) cannot coexist in the
      # 7.65GB Docker VM — loading the vision model killed the llama-server
      # (signal: killed, OOM) mid png_csv analysis. With MAX_LOADED_MODELS=1
      # ollama unloads the text model before loading the vision model.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4-mini:3.8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
    networks:
      - apoema_network
    entrypoint: ["/bin/bash", "/ollama-entrypoint.sh"]

  # Worker Dramatiq (executará tarefas assíncronas)
  dramatiq_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apoema-dramatiq-worker
    command: dramatiq --verbose tasks --processes 2
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-apoema}
      DB_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      DB_NAME: ${DB_NAME:-apoema_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      DRAMATIQ_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4-mini:3.8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PYTHONUNBUFFERED: 1
      # Task timeout configuration
      TASK_TIMEOUT_MINUTES: ${TASK_TIMEOUT_MINUTES:-15}
      # Dramatiq worker configuration
      DRAMATIQ_WORKER_TIMEOUT: ${DRAMATIQ_WORKER_TIMEOUT:-900}
      DRAMATIQ_WORKER_MAX_RETRIES: ${DRAMATIQ_WORKER_MAX_RETRIES:-2}
      DRAMATIQ_PREFETCH_COUNT: ${DRAMATIQ_PREFETCH_COUNT:-1}
      # Disable forking to keep long-running tasks alive
      DRAMATIQ_FORK_WORKERS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    networks:
      - apoema_network
    # Healthcheck to monitor worker process
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dramatiq tasks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Increase stop timeout to allow graceful shutdown of long-running tasks
    stop_grace_period: 120s

  # Worker de conversão de documentos (informativo PDF/XLSX -> JSON via docling).
  # Fila dedicada 'conversion': a conversão nunca bloqueia a fila FIFO de análises
  # e o docling (torch) só é carregado aqui, mantendo os workers de análise leves.
  converter_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apoema-converter-worker
    # Módulo (broker) ANTES das opções: no CLI 1.18 `-Q` tem nargs='*' e
    # engoliria o nome do módulo se viesse depois.
    command: dramatiq conversion_tasks -Q conversion --processes 1 --verbose
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-apoema}
      DB_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      DB_NAME: ${DB_NAME:-apoema_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      DRAMATIQ_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      PYTHONUNBUFFERED: 1
      # Cache dos modelos docling (layout/table) entre execuções
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: 1
      CONVERTER_OCR: ${CONVERTER_OCR:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - hf_cache:/root/.cache/huggingface
    networks:
      - apoema_network
    stop_grace_period: 60s

  # FastAPI application (API server)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apoema-app
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-apoema}
      DB_PASSWORD: ${DB_PASSWORD:-apoema_dev_password}
      DB_NAME: ${DB_NAME:-apoema_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4-mini:3.8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      PYTHONUNBUFFERED: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEBUG: "False"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - ./input:/app/input
      - ./output:/app/output
    working_dir: /app
    networks:
      - apoema_network
    # Runs the API server (default from Dockerfile)
    command: python run_api.py

volumes:
  postgres_data:
  rabbitmq_data:
  ollama_data:
  hf_cache:

networks:
  apoema_network:
    driver: bridge